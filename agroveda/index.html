<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/agroveda-logo-bg.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google" content="notranslate">
  <title>agroveda</title>

  <style>
    /* ── Google Translate toolbar hide ── */
    .goog-te-banner-frame,
    .goog-te-banner-frame.skiptranslate,
    iframe.skiptranslate { display: none !important; }

    .goog-te-gadget { display: none !important; }

    body { top: 0 !important; position: static !important; }

    /* Hide tooltip popup */
    #goog-gt-tt { display: none !important; }
    .goog-tooltip { display: none !important; }
    .goog-te-tooltip { display: none !important; }
    .goog-te-balloon-frame { display: none !important; }
    .goog-text-highlight { background: none !important; box-shadow: none !important; }

    /* Disable pointer on font tags Google wraps text in */
    font { pointer-events: none !important; }
    font * { pointer-events: auto !important; }
  </style>
</head>

<body>
  <div id="root"></div>

  <!-- Hidden Google Translate element -->
  <div id="google_translate_element" style="display:none"></div>

  <!-- Google Translate init -->
  <script>
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'en',
        includedLanguages: 'en,bn',
        autoDisplay: false
      }, 'google_translate_element');
    }
  </script>
  <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

  <!-- Remove hover tooltips Google Translate adds -->
  <script>
    function removeTranslateTitles() {
      document.querySelectorAll('font').forEach(el => {
        el.removeAttribute('title');
        el.removeAttribute('_mstmutation');
      });
      document.querySelectorAll('[title]').forEach(el => {
        const tag = el.tagName.toLowerCase();
        if (!['input','button','a','img','abbr','iframe'].includes(tag)) {
          el.removeAttribute('title');
        }
      });
    }

    const observer = new MutationObserver(removeTranslateTitles);

    document.addEventListener('DOMContentLoaded', () => {
      removeTranslateTitles();
      observer.observe(document.body, {
        childList: true,
        subtree: true,
        attributes: true,
        attributeFilter: ['title']
      });
    });

    window.addEventListener('load', () => {
      removeTranslateTitles();
      setTimeout(removeTranslateTitles, 500);
      setTimeout(removeTranslateTitles, 1500);
      setTimeout(removeTranslateTitles, 3000);
    });
  </script>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
